<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skygo Admin</title><link rel="stylesheet" href="/styles.css"></head><body>
<header><h1>Skygo Admin</h1><span>服务 · 主机 · 运维</span><button id="logout" hidden>退出登录</button></header><main>
<p id="notice" role="status"></p>
<section id="auth"><h2>登录</h2><form id="login" method="post"><label>账号<input name="username" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><label id="otp-label">动态码或恢复码<input name="code" autocomplete="one-time-code"></label><button type="button" id="captcha-refresh">刷新验证码</button><img id="captcha" alt="Six-digit sign-in challenge"><label>图片验证码<input name="captcha_code" inputmode="numeric" required maxlength="6"></label><button disabled>登录</button></form>
<details id="bootstrap-panel" hidden><summary>创建首位管理员</summary><form id="bootstrap" method="post"><label>初始化令牌<input name="token" type="password" required></label><label>账号<input name="username" required minlength="3"></label><label>邮箱<input name="email" type="email" required></label><label>密码（至少 12 个字符）<input name="password" type="password" required minlength="12"></label><button disabled>初始化</button></form></details></section>
<section id="workspace" hidden><aside id="sidebar"><div class="sidebar-brand">SKYGO · 管理控制台</div><nav id="tabs" aria-label="管理功能"></nav></aside><div class="toolbar"><h2 id="page-title"></h2><button id="refresh">刷新</button></div><p id="page-help"></p><div id="forms"></div><div id="data"></div></section>
<dialog id="result-dialog"><h2>操作结果</h2><p>请安全保存接入令牌或验证器信息；浏览器不会持久保存这些凭据。</p><pre id="result-content"></pre><button id="result-close">关闭并清除</button></dialog>
<dialog id="confirmation-dialog"><h2>邮件确认</h2><p>请核对邮件中的操作内容，再输入确认码。</p><form id="confirmation-form"><label>确认码<input name="code" required autocomplete="one-time-code"></label><button>确认</button><button type="button" id="confirmation-cancel">取消</button></form></dialog>
</main><script src="/locale.js" defer></script><script src="/releases.js" defer></script><script src="/publications.js" defer></script><script src="/distribution.js" defer></script><script src="/app.js" defer></script></body></html>
