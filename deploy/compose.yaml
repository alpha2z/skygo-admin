name: skygo-admin
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: skygo_admin
      MYSQL_USER: admin
      MYSQL_PASSWORD_FILE: /run/secrets/mysql-password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql-root-password
    volumes:
      - mysql-data:/var/lib/mysql
      - ../runtime/secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 30
  admin-api:
    image: ${ADMIN_API_IMAGE:-skygo-admin/admin-api:local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    # Local initialization files are 0600; use the host UID for local Compose.
    user: "${LOCAL_UID:-10001}:${LOCAL_GID:-10001}"
    environment:
      ADMIN_LISTEN_ADDRESS: 0.0.0.0:18391
      ADMIN_MYSQL_DSN_FILE: /run/secrets/mysql-dsn
      ADMIN_JWT_SECRET_FILE: /run/secrets/jwt
      ADMIN_BOOTSTRAP_TOKEN_FILE: /run/secrets/bootstrap
      ADMIN_SIGNING_KEY_FILE: /run/secrets/signing
      ADMIN_COOKIE_SECURE: "false"
      ADMIN_EMAIL_CONFIRMATION_ENABLED: "false"
      ADMIN_INDEPENDENT_APPROVAL_ENABLED: ${ADMIN_INDEPENDENT_APPROVAL_ENABLED:-false}
      ADMIN_TOTP_ENABLED: "true"
      ADMIN_TRUSTED_PROXY_CIDRS: 172.30.81.0/24
    volumes:
      - ../runtime/secrets:/run/secrets:ro
    ports: ["127.0.0.1:18391:18391"]
    depends_on:
      mysql:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
  admin-web:
    image: ${ADMIN_WEB_IMAGE:-skygo-admin/admin-web:local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    ports: ["127.0.0.1:18390:8080"]
    depends_on: [admin-api]
volumes:
  mysql-data:
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.81.0/24
