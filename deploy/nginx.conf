server {
 listen 8080;
 server_name _;
 root /usr/share/nginx/html;
 client_max_body_size 512k;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self'; connect-src 'self'" always;
 location /api/ { proxy_pass http://admin-api:18391; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; }
 location /agent/ { proxy_pass http://admin-api:18391; proxy_set_header Host $host; }
 location /healthz { proxy_pass http://admin-api:18391; }
 location / { try_files $uri $uri/ =404; }
}
