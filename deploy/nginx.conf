# UI assets must not survive an image rollback in the browser cache.
# Public artifact/download locations retain their own caching contract.
map $uri $admin_ui_cache_control {
 default "";
 "/" "no-store";
 ~^/[^/]+\.(html|js|css)$ "no-store";
 ~^/extensions/ "no-store";
}
server {
 listen 8080;
 server_name _;
 root /usr/share/nginx/html;
 include /etc/nginx/admin-extensions/*.conf;
 client_max_body_size 512k;
 add_header Cache-Control $admin_ui_cache_control always;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self'; connect-src 'self'" always;
 location /api/ { proxy_pass http://admin-api:18391; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; }
 location /extensions/ { proxy_pass http://admin-api:18391; proxy_set_header Host $host; }
 location /agent/ { proxy_pass http://admin-api:18391; proxy_set_header Host $host; }
 location /healthz { proxy_pass http://admin-api:18391; }
 location / { try_files $uri $uri/ =404; }
}
