services:
  ops-agent:
    image: ${OPS_AGENT_IMAGE:?required}
    restart: unless-stopped
    network_mode: host
    command: [-config, /run/private/agent.json]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_ROOT_DIR:-/var/lib/docker}:${DOCKER_ROOT_DIR:-/var/lib/docker}:ro
      - ./private:/run/private:ro
      - ./state:/var/lib/skygo-admin
      - ${MANAGED_DEPLOYMENTS_DIR:?required}:${MANAGED_DEPLOYMENTS_DIR}
  agent-updater:
    image: ${OPS_UPDATER_IMAGE:?Set a pinned transitional Agent image}
    restart: unless-stopped
    network_mode: host
    command: [-updater, -config, /run/private/agent.json]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./private:/run/private:ro
      - ./state:/var/lib/skygo-admin
      - ${MANAGED_DEPLOYMENTS_DIR:?required}:${MANAGED_DEPLOYMENTS_DIR}
