# Install as /etc/skygo-admin/compose.yaml alongside private/compose.env.
# Provision an external management database and run explicit migrations first.
name: admin
services:
  admin-api:
    image: ${ADMIN_API_IMAGE:?Set a trusted immutable API image}
    restart: unless-stopped
    user: "${LOCAL_UID:-10001}:${LOCAL_GID:-10001}"
    environment:
      ADMIN_LISTEN_ADDRESS: 0.0.0.0:18391
      ADMIN_MYSQL_DSN_FILE: /run/private/mysql-dsn
      ADMIN_JWT_SECRET_FILE: /run/private/jwt
      ADMIN_BOOTSTRAP_TOKEN_FILE: /run/private/bootstrap
      ADMIN_SIGNING_KEY_FILE: /run/private/signing
      ADMIN_TRUSTED_PROXY_CIDRS: ${ADMIN_TRUSTED_PROXY_CIDRS:?Set the trusted proxy network}
      ADMIN_COOKIE_SECURE: "true"
      ADMIN_TOTP_ENABLED: "true"
      ADMIN_EMAIL_CONFIRMATION_ENABLED: "true"
      ADMIN_SMTP_ADDRESS: ${ADMIN_SMTP_ADDRESS:?Configure SMTP}
      ADMIN_SMTP_USERNAME: ${ADMIN_SMTP_USERNAME:-}
      ADMIN_SMTP_FROM: ${ADMIN_SMTP_FROM:?Configure sender}
      ADMIN_SMTP_PASSWORD_FILE: /run/private/smtp-password
      ADMIN_GITHUB_CONFIG: /run/private/github.json
    volumes:
      - ./private:/run/private:ro
    ports: ["127.0.0.1:18391:18391"]
    read_only: true
    tmpfs: [/tmp]
  admin-web:
    image: ${ADMIN_WEB_IMAGE:?Set a trusted immutable Web image}
    restart: unless-stopped
    ports: ["127.0.0.1:18390:8080"]
    depends_on: [admin-api]
